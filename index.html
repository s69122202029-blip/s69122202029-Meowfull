<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeowMart — ร้านอาหารแมว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EF; --ink:#2A241C; --ink-soft:#6b6255;
    --sage:#67785A; --sage-dark:#4C5A41; --marigold:#E4A93F;
    --plum:#6E3B3B; --line:#E4DCC9; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 .3em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;}
  nav{display:flex;gap:6px;}
  nav button{border:none;background:transparent;padding:8px 16px;border-radius:20px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
  nav button.active{background:var(--sage);color:#fff;}
  .cart-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;}
  main{max-width:960px;margin:0 auto;padding:28px 32px 80px;}
  .page{display:none;}
  .page.active{display:block;}
  .lede{color:var(--ink-soft);max-width:560px;margin-bottom:22px;line-height:1.6;}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:20px;font-size:13px;margin:0 8px 8px 0;cursor:pointer;user-select:none;}
  .chip input{accent-color:var(--sage);}
  .chip.active{background:var(--sage);border-color:var(--sage);color:#fff;}
  .console{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#221E17;color:#EFE7D6;border-radius:10px;padding:12px 16px;margin:14px 0 22px;line-height:1.7;}
  .console .op{color:var(--marigold);}
  .console .lbl{color:#9FB08B;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;}
  .thumb{font-size:34px;background:#F1ECDF;border-radius:10px;height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .tagrow{display:flex;flex-wrap:wrap;gap:4px;}
  .tag{font-size:10.5px;color:var(--sage-dark);background:#EDF1E7;padding:2px 7px;border-radius:8px;}
  .price{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--plum);}
  .btn{border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  section.block{margin-bottom:30px;}
  .banner{background:#EDF1E7;border:1px solid #D8E2CE;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;color:var(--sage-dark);}
  .catrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .cart-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cart-row .name{flex:1;font-size:14px;}
  .qty{display:flex;align-items:center;gap:6px;}
  .qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:18px;}
  .summary-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;}
  .summary-row.total{font-weight:600;font-size:17px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;}
  .discount{color:var(--sage-dark);}
  .promo-box{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:10px;}
  .promo-yes{background:#EDF1E7;color:var(--sage-dark);}
  .promo-no{background:#F5F0E4;color:var(--ink-soft);}
  .empty{color:var(--ink-soft);font-size:14px;padding:24px 0;text-align:center;}
  select,input[type=text]{font-family:'Inter',sans-serif;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13.5px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px;}
  .hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:26px;height:280px;}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(42,36,28,0.05) 0%, rgba(42,36,28,0.55) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:22px 26px;}
  .hero-overlay h2{color:#fff;font-size:24px;margin:0 0 4px;}
  .hero-overlay p{color:#F1ECDF;font-size:13.5px;margin:0;}
  .cart-row .thumb{width:44px;height:44px;font-size:20px;}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-mark">M</div><strong>MeowMart</strong></div>
  <nav id="nav">
    <button data-page="home" class="active">หน้าแรก</button>
    <button data-page="products">สินค้า</button>

  </nav>
  <div class="cart-pill" data-page="checkout" onclick="goPage('checkout')">🛒 <span id="cartCount">0</span> ชิ้น</div>
</header>
