<script>
/* =========================================================================
   1) DATA STORE (Products & Categories)
   ========================================================================= */
const PRODUCTS = [
  { id: 'P001', name: 'อาหารแมวพรีเมียม สูตรแซลมอน', category: 'อาหารแห้ง', price: 350, tags: ['แซลมอน', 'แมวโต', 'โซเดียมต่ำ'], desc: 'อุดมด้วย โอเมก้า 3 และ 6 บำรุงขนให้นุ่มสวย' },
  { id: 'P002', name: 'อาหารเปียกทูน่าหน้ากุ้ง ในเยลลี่', category: 'อาหารเปียก', price: 45, tags: ['ทูน่า', 'กุ้ง', 'อาหารเปียก'], desc: 'ผลิตจากเนื้อทูน่าแท้ หอมอร่อย กลิ่นเตะจมูกน้องแมว' },
  { id: 'P003', name: 'อาหารแมวเด็ก สูตรทูน่า & นมวัว', category: 'อาหารแห้ง', price: 290, tags: ['ทูน่า', 'คิตเท่น', 'เสริมโปรตีน'], desc: 'เม็ดเล็กเคี้ยวง่าย เสริมสร้างกระดูกและภูมิต้านทาน' },
  { id: 'P004', name: 'ขนมแมวเลีย รสปลาแซลมอน (แพ็ก 4 ซอง)', category: 'ขนมแมว', price: 65, tags: ['แซลมอน', 'ขนม', 'แมวโต'], desc: 'ขนมครีมแมวเลียยอดฮิต สุขภาพดี อร่อยเพลิดเพลิน' },
  { id: 'P005', name: 'อาหารเปียกสูตรบำรุงไต & โซเดียมต่ำ', category: 'อาหารเปียก', price: 55, tags: ['อาหารเปียก', 'โซเดียมต่ำ', 'บำรุงสุขภาพ'], desc: 'สูตรดูแลระบบไต ลดปริมาณเกลือ เหมาะกับแมวสูงวัย' },
  { id: 'P006', name: 'ไม้ตกแมวขนนกพร้อมกระดิ่ง', category: 'ของเล่น', price: 89, tags: ['ของเล่น', 'คลายเครียด'], desc: 'กระตุ้นสัญชาตญาณนักล่า ฝึกทักษะการเคลื่อนไหว' }
];

/* =========================================================================
   2) STATE MANAGEMENT
   ========================================================================= */
let cart = []; // Store items: { product, qty }
let selectedTags = new Set();
let currentOp = 'union';

/* =========================================================================
   3) INITIALIZATION
   ========================================================================= */
document.addEventListener('DOMContentLoaded', () => {
  setupNavigation();
  setupFilters();
  renderHome();
  renderProducts();
  renderCart();
});

/* =========================================================================
   4) NAVIGATION SYSTEM
   ========================================================================= */
function setupNavigation() {
  const navBtns = document.querySelectorAll('[data-page]');
  navBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const targetPage = e.currentTarget.getAttribute('data-page');
      switchPage(targetPage);
    });
  });

  document.getElementById('enterShopBtn').addEventListener('click', () => switchPage('home'));
  document.getElementById('confirmOrderBtn').addEventListener('click', handleCheckout);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
}

function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('is-active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('is-active'));

  const target = document.getElementById(`page-${pageId}`);
  if (target) target.classList.add('is-active');

  const activeNav = document.querySelector(`.nav-btn[data-page="${pageId}"]`);
  if (activeNav) activeNav.classList.add('is-active');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================================
   5) RENDER HOME PAGE
   ========================================================================= */
function renderHome() {
  // Stats
  const statsContainer = document.getElementById('heroStats');
  const categoriesSet = new Set(PRODUCTS.map(p => p.category));
  
  statsContainer.innerHTML = `
    <div><b>${PRODUCTS.length}</b><span>รายการสินค้า</span></div>
    <div><b>${categoriesSet.size}</b><span>หมวดหมู่หลัก</span></div>
    <div><b>100%</b><span>ของแท้เกรดพรีเมียม</span></div>
  `;

  // Hero Art
  document.getElementById('heroArt').innerHTML = `
    <div class="art-wrap">
      <svg class="art-icon" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" fill="#F4A261"/>
        <path d="M20 42 C 20 28, 44 28, 44 42" stroke="#1B4B43" stroke-width="4" stroke-linecap="round"/>
        <circle cx="24" cy="26" r="3" fill="#1B4B43"/>
        <circle cx="40" cy="26" r="3" fill="#1B4B43"/>
      </svg>
    </div>
  `;

  // Category Grid (Using Set)
  const catGrid = document.getElementById('categoryGrid');
  catGrid.innerHTML = Array.from(categoriesSet).map(cat => {
    const count = PRODUCTS.filter(p => p.category === cat).length;
    return `
      <div class="cat-card" onclick="filterByCategory('${cat}')">
        <span class="badge">Set Item</span>
        <div class="n">${cat}</div>
        <div class="c">${count} รายการ</div>
      </div>
    `;
  }).join('');

  // Featured Grid
  const featuredGrid = document.getElementById('featuredGrid');
  featuredGrid.innerHTML = PRODUCTS.slice(0, 3).map(p => createProductCardMarkup(p)).join('');
}

function filterByCategory(catName) {
  switchPage('products');
  document.getElementById('searchInput').value = catName;
  renderProducts();
}

/* =========================================================================
   6) SET OPERATIONS & PRODUCTS FILTERING
   ========================================================================= */
function setupFilters() {
  // Collect all unique tags using Set
  const allTags = new Set();
  PRODUCTS.forEach(p => p.tags.forEach(t => allTags.add(t)));

  const chipRow = document.getElementById('tagChips');
  chipRow.innerHTML = Array.from(allTags).map(tag => `
    <button class="chip" data-tag="${tag}">${tag}</button>
  `).join('');

  chipRow.addEventListener('click', (e) => {
    if (!e.target.classList.contains('chip')) return;
    const tag = e.target.getAttribute('data-tag');
    if (selectedTags.has(tag)) {
      selectedTags.delete(tag);
      e.target.classList.remove('is-on');
    } else {
      selectedTags.add(tag);
      e.target.classList.add('is-on');
    }
    renderProducts();
  });

  // Operation buttons
  const opBtns = document.querySelectorAll('.op-btn');
  opBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      opBtns.forEach(b => b.classList.remove('is-on'));
      const target = e.currentTarget;
      target.classList.add('is-on');
      currentOp = target.getAttribute('data-op');
      renderProducts();
    });
  });

  // Search Input & Clear Filters
  document.getElementById('searchInput').addEventListener('input', renderProducts);
  document.getElementById('clearFilters').addEventListener('click', () => {
    selectedTags.clear();
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('is-on'));
    document.getElementById('searchInput').value = '';
    renderProducts();
  });
}

function renderProducts() {
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = PRODUCTS;

  // 1. Text Search Filter
  if (searchTerm) {
    filtered = filtered.filter(p => 
      p.name.toLowerCase().includes(searchTerm) || 
      p.category.toLowerCase().includes(searchTerm) ||
      p.tags.some(t => t.toLowerCase().includes(searchTerm))
    );
  }

  // 2. Set Operations Logic (Union / Intersection / Difference)
  if (selectedTags.size > 0) {
    filtered = filtered.filter(product => {
      const productTags = new Set(product.tags);

      if (currentOp === 'union') {
        // Union: Has AT LEAST ONE selected tag
        for (let tag of selectedTags) {
          if (productTags.has(tag)) return true;
        }
        return false;
      } 
      else if (currentOp === 'intersect') {
        // Intersection: Has ALL selected tags
        for (let tag of selectedTags) {
          if (!productTags.has(tag)) return false;
        }
        return true;
      } 
      else if (currentOp === 'difference') {
        // Difference: Has first selected tag BUT NOT others
        const tagsArr = Array.from(selectedTags);
        const firstTag = tagsArr[0];
        const otherTags = tagsArr.slice(1);

        if (!productTags.has(firstTag)) return false;
        for (let tag of otherTags) {
          if (productTags.has(tag)) return false;
        }
        return true;
      }
      return true;
    });
  }

  // Render Result Counter
  document.getElementById('resultLine').innerHTML = `พบสินค้า <b>${filtered.length}</b> รายการ`;

  // Render Grid
  const productsGrid = document.getElementById('productsGrid');
  if (filtered.length === 0) {
    productsGrid.innerHTML = `<div class="empty-note" style="grid-column: 1/-1">ไม่พบสินค้าที่ตรงตามเงื่อนไข Set / คำค้นหาที่ระบุ</div>`;
  } else {
    productsGrid.innerHTML = filtered.map(p => createProductCardMarkup(p)).join('');
  }
}

function createProductCardMarkup(p) {
  return `
    <div class="prod-card">
      <div class="prod-img">
        <div class="art-wrap">
          <svg class="art-icon" viewBox="0 0 64 64" fill="none">
            <rect x="12" y="16" width="40" height="36" rx="8" fill="#B7D8C1"/>
            <circle cx="32" cy="34" r="10" fill="#FFF8F0"/>
            <path d="M28 34 L36 34 M32 30 L32 38" stroke="#E76F51" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div class="prod-body">
        <div class="prod-tags">
          <span class="tag">${p.category}</span>
          ${p.tags.map(t => `<span class="tag alt">${t}</span>`).join('')}
        </div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-desc">${p.desc}</div>
        <div class="prod-foot">
          <div class="price">฿${p.price}</div>
          <button class="add-btn" onclick="addToCart('${p.id}')">+ ใส่ตะกร้า</button>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   7) CART & CHECKOUT MANAGEMENT
   ========================================================================= */
function addToCart(productId) {
  const product = PRODUCTS.find(p => p.id === productId);
  if (!product) return;

  const existing = cart.find(item => item.product.id === productId);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ product, qty: 1 });
  }

  renderCart();
}

function updateQty(productId, delta) {
  const item = cart.find(i => i.product.id === productId);
  if (!item) return;

  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.product.id !== productId);
  }
  renderCart();
}

function removeFromCart(productId) {
  cart = cart.filter(i => i.product.id !== productId);
  renderCart();
}

function renderCart() {
  const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById('cartCount').innerText = totalCount;
  document.getElementById('itemCount').innerText = totalCount;

  const cartList = document.getElementById('cartList');
  if (cart.length === 0) {
    cartList.innerHTML = `<div class="empty-note">ตะกร้าของคุณยังว่างอยู่ เลือกสินค้าใส่ตะกร้าได้เลย! 🐾</div>`;
  } else {
    cartList.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="art-wrap">
          <svg class="art-icon" viewBox="0 0 64 64" fill="none">
            <rect x="16" y="16" width="32" height="32" rx="6" fill="#F4A261"/>
          </svg>
        </div>
        <div class="ci-body">
          <div class="ci-top">
            <div class="ci-name">${item.product.name}</div>
            <button class="ci-remove" onclick="removeFromCart('${item.product.id}')">ลบ</button>
          </div>
          <div class="ci-price">฿${item.product.price * item.qty}</div>
          <div class="qty-row">
            <button class="qty-btn" onclick="updateQty('${item.product.id}', -1)">-</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${item.product.id}', 1)">+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Calculations
  const subtotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
  let discount = 0;
  let shipping = cart.length > 0 ? 40 : 0;

  if (subtotal >= 500) {
    discount = 50;
    shipping = 0;
  }

  const grandTotal = Math.max(0, subtotal - discount + shipping);

  document.getElementById('subtotal').innerText = `฿${subtotal}`;
  document.getElementById('discountLine').innerText = `-฿${discount}`;
  document.getElementById('shipLine').innerText = `฿${shipping}`;
  document.getElementById('grandTotal').innerText = `฿${grandTotal}`;

  // Promo Box Nudge
  const promoBox = document.getElementById('promoBox');
  if (subtotal >= 500) {
    promoBox.innerHTML = `
      <div class="promo on">
        <div class="dot"></div>
        <div><b>ยินดีด้วย!</b> คุณได้รับส่วนลด ฿50 และส่งฟรี (ยอดเกิน ฿500)</div>
      </div>
    `;
  } else if (cart.length > 0) {
    promoBox.innerHTML = `
      <div class="promo">
        <div class="dot"></div>
        <div>ซื้อเพิ่มอีก ฿${500 - subtotal} เพื่อรับส่วนลด ฿50 และฟรีค่าจัดส่ง!</div>
      </div>
    `;
  } else {
    promoBox.innerHTML = '';
  }

  // Set Difference Recommendation Engine for Cart
  renderRecommendations();
}

/* =========================================================================
   8) SET DIFFERENCE RECOMMENDATION ENGINE
   ========================================================================= */
function renderRecommendations() {
  const cartCategories = new Set(cart.map(item => item.product.category));
  const cartProductIds = new Set(cart.map(item => item.product.id));

  // Set Difference: Products NOT in cart but share category context or popular
  const recommended = PRODUCTS.filter(p => !cartProductIds.has(p.id)).slice(0, 4);

  const recoGrid = document.getElementById('recoGrid');
  if (recommended.length === 0) {
    recoGrid.innerHTML = `<div style="grid-column:1/-1;font-size:13px;color:var(--ink-soft);">ไม่มีสินค้าแนะนำเพิ่มเติม</div>`;
    return;
  }

  recoGrid.innerHTML = recommended.map(p => `
    <div class="reco-card">
      <div class="art-wrap">
        <svg class="art-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="20" fill="#B7D8C1"/>
        </svg>
      </div>
      <div class="n">${p.name}</div>
      <div class="p">฿${p.price}</div>
      <button onclick="addToCart('${p.id}')">+ เพิ่ม</button>
    </div>
  `).join('');
}

/* =========================================================================
   9) CHECKOUT & MODAL SYSTEM
   ========================================================================= */
function handleCheckout() {
  if (cart.length === 0) {
    alert('กรุณาเลือกสินค้าใส่ตะกร้าก่อนทำการสั่งซื้อครับ');
    return;
  }

  const orderNo = 'MEOW-' + Math.floor(100000 + Math.random() * 900000);
  const subtotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
  const discount = subtotal >= 500 ? 50 : 0;
  const shipping = subtotal >= 500 ? 0 : 40;
  const grandTotal = subtotal - discount + shipping;

  document.getElementById('modalOrderNo').innerHTML = `หมายเลขคำสั่งซื้อ: <b>${orderNo}</b>`;
  document.getElementById('modalSummary').innerHTML = `
    <div class="m-row"><span>จำนวนสินค้า:</span><span>${cart.reduce((s, i) => s + i.qty, 0)} ชิ้น</span></div>
    <div class="m-row"><span>ราคารวม:</span><span>฿${subtotal}</span></div>
    <div class="m-row"><span>ส่วนลด/ค่าจัดส่ง:</span><span>-฿${discount} / ฿${shipping}</span></div>
    <div class="m-row total"><span>ยอดสุทธิ:</span><span>฿${grandTotal}</span></div>
  `;

  document.getElementById('orderModalBackdrop').classList.add('is-open');
}

function closeModal() {
  document.getElementById('orderModalBackdrop').classList.remove('is-open');
  cart = [];
  renderCart();
  switchPage('home');
}
</script>
